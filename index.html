  <script src="https://cdn.jsdelivr.net/npm/shepherd.js@11.0.1/dist/js/shepherd.min.js"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Cores Inteligentes do Badge (Light/Dark) */
    :root {
        --kcs-unlimited: #c2410c;
        --kcs-teams: #4338ca;
        --kcs-starter: #15803d;
        --kcs-badge-glow: transparent;
    }

    html.dark {
        --kcs-unlimited: #fb923c;
        --kcs-teams: #818cf8;
        --kcs-starter: #4ade80;
        --kcs-badge-glow: 0 0 8px currentColor;
    }

    /* Estrutura Minimalista */
    .kcs-plan-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 2px 10px;
        border-radius: 4px;
        border: 1px solid currentColor;
        white-space: nowrap;
        line-height: 1.2;
        margin-top: 4px; 
    }

    html.dark .kcs-plan-badge {
        text-shadow: var(--kcs-badge-glow);
    }

    body { background: #131314; font-family: 'Google Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3b3d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    textarea { tab-size: 2; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e1f20 inset !important; -webkit-text-fill-color: #fff !important; }
    
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    .animate-slide-out { animation: slideOut 0.3s ease-in; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    svg { flex-shrink: 0; }
    input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }

    i.ph, i.ph-fill { line-height: 1; vertical-align: middle; }

    .shepherd-element { background: #1e1f20 !important; border: 1px solid #3a3b3d !important; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); padding: 0 !important; overflow: hidden; }
    .shepherd-arrow:before { background: #1e1f20 !important; border: 1px solid #3a3b3d !important; }
    .shepherd-header { background: transparent !important; border-bottom: 1px solid #3a3b3d !important; padding: 16px 20px !important; margin: 0 !important; align-items: center; }
    .shepherd-title { font-size: 1rem !important; font-weight: bold !important; color: #fff !important; margin: 0 !important; display: flex; align-items: center; gap: 8px;}
    .shepherd-text { font-size: 0.875rem !important; color: #d1d5db !important; line-height: 1.5 !important; padding: 20px !important; margin: 0 !important; }
    .shepherd-footer { padding: 0 20px 20px !important; margin: 0 !important; border: none !important; background: transparent !important;}
    .shepherd-cancel-icon { color: #9ca3af !important; transition: color 0.2s; margin-bottom: 0 !important; }
    .shepherd-cancel-icon:hover { color: #fff !important; }

    /* Alternância de Ícones Tema */
    html.dark #theme-icon-sun { display: block; }
    html.dark #theme-icon-moon { display: none; }
    html.light #theme-icon-sun { display: none; }
    html.light #theme-icon-moon { display: block; }

    /* ==========================================================================
       LIGHT MODE - UX/UI OTIMIZADO (Redução de Fadiga Visual e Elevação)
       ========================================================================== */
    
    /* 1. Canvas Principal (Fundo da aplicação) - Fundo absorvente */
    html.light body,
    html.light .bg-bg-main,
    html.light .bg-\[\#131314\] { 
        background-color: var(--bg-canvas) !important; 
        color: var(--text-primary) !important; 
    }

    /* 2. Sidebar e Header (Surface - Nível 1) */
    html.light .bg-surface,
    html.light .bg-\[\#1e1f20\] { 
        background-color: var(--bg-surface) !important; 
        border-color: var(--border-strong) !important; 
    }

    /* 3. Cards, Modais e Áreas de Destaque (Overlay - Nível 2) */
    html.light .bg-surface-overlay,
    html.light .modal-box,
    html.light #article-modal > div,
    html.light #view-modal > div,
    html.light #sql-modal > div,
    html.light .login-container { 
        background-color: #FFFFFF !important; 
        border-color: #E2E8F0 !important; 
        box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.03) !important;
    }

    /* Variantes de Transparência (Blur) */
    html.light .bg-bg-main\/50, 
    html.light .bg-bg-main\/30 { 
        background-color: rgba(238, 242, 247, 0.85) !important; 
        backdrop-filter: blur(8px);
    }

    /* 4. Bordas e Separadores (Guias visuais brandas) */
    html.light .border-border-subtle, 
    html.light .border-gray-700, 
    html.light .border-gray-700\/50, 
    html.light .border-gray-700\/30 { 
        border-color: #E2E8F0 !important; 
    }

    /* 5. Interações, Menus e Hover States */
    html.light .bg-gray-800\/50, 
    html.light .bg-gray-800,
    html.light .bg-gray-700\/60,
    html.light .bg-gray-600, 
    html.light .bg-gray-700 { 
        background-color: #F8FAFC !important; 
        border-color: #E2E8F0 !important; 
        color: #334155 !important; 
    }

    html.light .hover\:bg-gray-800:hover,
    html.light .hover\:bg-gray-700:hover,
    html.light .hover\:bg-gray-600:hover,
    html.light .hover\:bg-gray-500:hover,
    html.light .hover\:bg-gray-100:hover { 
        background-color: #E5E7EB !important; 
        color: #0F172A !important; 
    }

    /* 6. Hierarquia Tipográfica (Chega de branco "invisível") */
    html.light .text-white:not([class*="bg-blue"]):not([class*="bg-purple"]):not([class*="bg-red"]):not([class*="bg-green"]) { color: #0F172A !important; }
    html.light .text-gray-300 { color: #334155 !important; }
    html.light .text-gray-400 { color: #475569 !important; }
    html.light .text-gray-500 { color: #64748B !important; }

    /* 7. Fundo Escurecido de Modais (Foco direcional) */
    html.light .bg-black\/30, 
    html.light .bg-black\/50, 
    html.light .bg-black\/60,
    html.light .bg-black\/70,
    html.light .modal-backdrop { 
        background-color: rgba(15, 23, 42, 0.4) !important; 
        backdrop-filter: blur(4px); 
        border: none !important;
    }

    /* 8. Campos de Input e Textarea */
    html.light input, 
    html.light textarea, 
    html.light select {
        background-color: #FFFFFF !important;
        border: 1px solid #CBD5E1 !important;
        color: #0F172A !important;
    }
    html.light input:focus, 
    html.light textarea:focus, 
    html.light select:focus {
        border-color: #3B82F6 !important;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        outline: none !important;
    }

    /* 9. Tabelas: Zebra Striping e Limpeza Visual */
    html.light .table-responsive, 
    html.light table {
        background-color: #FFFFFF !important;
    }
    html.light table th {
        background-color: #F8FAFC !important;
        color: #475569 !important;
        border-bottom: 1px solid #CBD5E1 !important;
        font-weight: 600 !important;
    }
    html.light table tbody tr { background-color: #FFFFFF !important; transition: background-color 0.2s ease; }
    html.light table tbody tr:nth-child(even) { background-color: #F8FAFC !important; }
    html.light table tbody tr:hover { background-color: #E5E7EB !important; }
    html.light table td { border-bottom: 1px solid #E2E8F0 !important; color: #334155 !important; }

    /* 10. Scrollbar Refinada */
    html.light ::-webkit-scrollbar-thumb { 
        background: #CBD5E1; 
        border-radius: 6px;
        border: 3px solid transparent; 
        background-clip: padding-box;
    }
    html.light ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>

  <div id="sql-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-2 sm:p-4 modal-backdrop backdrop-blur-sm">
    <div class="bg-surface border border-border-subtle rounded-xl sm:rounded-2xl w-full max-w-4xl h-[100dvh] sm:h-auto sm:max-h-[90vh] flex flex-col shadow-2xl modal-box">
        <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 border-b border-border-subtle shrink-0">
            <h2 id="sql-modal-title" class="text-base sm:text-lg font-bold text-gray-900 dark:text-white">Novo Script SQL</h2>
            <button id="btn-cancel-sql" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button>
        </div>
        <form id="sql-form" class="flex-1 overflow-y-auto flex flex-col custom-scrollbar">
            <div id="sql-form-body" class="p-4 sm:p-6 space-y-4 flex-1"></div>
            <div id="sql-form-footer" class="flex flex-col sm:flex-row justify-end gap-3 px-4 sm:px-6 py-4 border-t border-border-subtle bg-bg-main/50 pb-[calc(env(safe-area-inset-bottom,0)+1rem)] sm:pb-4"></div>
        </form>
    </div>
  </div>

  <div id="category-modal" class="hidden fixed inset-0 bg-black/70 z-[100] items-center justify-center p-4 modal-backdrop">
    <div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-lg max-h-[80vh] flex flex-col shadow-2xl modal-box"><div class="flex items-center justify-between px-6 py-4 border-b border-border-subtle"><h2 class="text-lg font-bold text-gray-900 dark:text-white">Categorias</h2><button id="btn-close-category-modal" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button></div><div class="flex-1 overflow-y-auto p-4 custom-scrollbar"><div id="category-list" class="space-y-0.5 mb-4"></div><form id="category-form" class="bg-gray-50 dark:bg-bg-main rounded-lg p-4 space-y-3 border border-border-subtle"><p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Nova Categoria</p><div class="grid grid-cols-3 gap-2"><input type="text" id="cat-name" placeholder="Nome" required class="col-span-2 bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm" /><input type="text" id="cat-icon" placeholder="Ícone" value="ph-folder" class="bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm text-center" /></div><select id="cat-parent" class="w-full bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm"><option value="">Raiz</option></select><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm py-2.5 rounded-lg touch-target transition-colors">Adicionar</button></form></div></div>
  </div>

  <div id="confirm-modal" class="hidden fixed inset-0 bg-black/70 z-[110] items-center justify-center p-4 modal-backdrop">
    <div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-sm shadow-2xl p-6 modal-box"><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-full bg-red-100 dark:bg-red-600/20 flex items-center justify-center shrink-0"><i class="ph ph-warning-circle text-red-600 dark:text-red-400 text-[24px]"></i></div><p id="confirm-message" class="text-sm font-semibold text-gray-800 dark:text-gray-200"></p></div><div class="flex flex-col sm:flex-row justify-end gap-3"><button id="btn-confirm-no" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white px-4 py-2.5 rounded-lg transition-colors border border-gray-300 dark:border-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-800 touch-target w-full sm:w-auto">Cancelar</button><button id="btn-confirm-yes" class="text-sm font-bold bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg shadow-md transition-colors touch-target w-full sm:w-auto">Confirmar</button></div></div>
  </div>

  <div id="alert-modal" class="hidden fixed inset-0 bg-black/70 z-[110] items-center justify-center p-4 modal-backdrop">
    <div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-sm md:max-w-lg shadow-2xl p-6 text-center modal-box"><p id="alert-message" class="text-sm text-gray-700 dark:text-gray-300 mb-5 text-left max-h-[50vh] overflow-y-auto bg-gray-50 dark:bg-bg-main p-4 rounded-lg border border-border-subtle font-mono custom-scrollbar"></p><button id="btn-alert-ok" class="w-full text-sm bg-blue-600 hover:bg-blue-700 font-bold transition-colors text-white px-4 py-3 rounded-lg shadow-md touch-target">Entendi</button></div>
  </div>

  <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 z-[90] items-center justify-center p-2 sm:p-4 md:p-8 modal-backdrop"><div class="bg-surface border border-border-subtle rounded-xl sm:rounded-2xl w-full max-w-5xl h-[100dvh] sm:h-[90vh] flex flex-col shadow-2xl modal-box"><div class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-border-subtle shrink-0"><h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="ph-fill ph-gear"></i> Admin</h2><button onclick="document.getElementById('settings-modal').classList.add('hidden'); document.getElementById('settings-modal').classList.remove('flex');" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[24px] font-bold"></i></button></div><div class="flex flex-col flex-1 overflow-hidden bg-gray-50 dark:bg-bg-main sm:rounded-b-2xl"><div id="settings-users-col" class="w-full p-4 md:p-6 flex flex-col overflow-hidden"><div class="flex-1 overflow-y-auto pr-2 custom-scrollbar"><div id="users-list" class="space-y-6"></div></div></div></div></div></div>
  <div id="history-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4 modal-backdrop"><div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-2xl max-h-[80vh] flex flex-col shadow-2xl modal-box"><div class="flex items-center justify-between px-6 py-4 border-b border-border-subtle"><h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="ph ph-clock-counter-clockwise text-blue-500 dark:text-blue-400"></i> Histórico</h2><button onclick="document.getElementById('history-modal').classList.add('hidden'); document.getElementById('history-modal').classList.remove('flex');" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button></div><div class="flex-1 overflow-y-auto p-4 bg-gray-50 dark:bg-bg-main/30 custom-scrollbar"><div id="history-list" class="space-y-3"></div></div></div></div>
  <div id="prompt-modal" class="hidden fixed inset-0 bg-black/70 z-[110] items-center justify-center p-4 modal-backdrop"><div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-md shadow-2xl p-6 modal-box"><h3 id="prompt-message" class="text-gray-900 dark:text-white text-base font-bold mb-3 flex items-center gap-2">💬 Comentário</h3><textarea id="prompt-input" rows="4" class="w-full bg-gray-50 dark:bg-bg-main border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm mb-4 focus:ring-1 focus:ring-blue-500 resize-y shadow-inner"></textarea><div class="flex justify-end gap-3"><button id="btn-prompt-cancel" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-800 touch-target">Cancelar</button><button id="btn-prompt-confirm" class="text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg shadow-md touch-target">Salvar</button></div></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
