<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <circle cx='30' cy='30' r='10' fill='%23007ACC'/>
  <circle cx='70' cy='30' r='10' fill='%23007ACC'/>
  <circle cx='50' cy='70' r='10' fill='%23007ACC'/>
  <path d='M30 30 L70 30 L50 70 Z'
        stroke='%23007ACC'
        stroke-width='4'
        fill='none'/>
</svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KCS Knowledge System</title>
  <meta name="description" content="Base de Conhecimento Corporativa — Knowledge Centered Service" />

  <script>
    const savedTheme = localStorage.getItem('kcs_theme') || 'dark';
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.4.2/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shepherd.js@11.0.1/dist/css/shepherd.css"/>
  <script src="https://cdn.jsdelivr.net/npm/shepherd.js@11.0.1/dist/js/shepherd.min.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
 
</head>
<body class="bg-bg-main text-white h-[100dvh] overflow-hidden"> 

  <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3 bg-surface p-6 rounded-2xl shadow-2xl border border-border-subtle">
        <div class="w-10 h-10 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-sm font-semibold text-gray-300" id="loading-msg">Processando...</span>
    </div>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-[150] flex flex-col gap-2 max-w-sm w-[90vw] sm:w-auto"></div>

  <div id="login-screen" class="hidden fixed inset-0 z-[100] flex items-center justify-center login-page-bg transition-colors duration-500 p-4 sm:p-6 overflow-hidden">
    <div class="login-container relative w-full max-w-[420px] p-8 sm:p-10 rounded-[20px] shadow-2xl flex flex-col transform transition-all">
        <span class="absolute top-5 right-6 text-[10px] login-text-muted font-mono font-bold tracking-widest px-2 py-1 rounded border login-border-subtle">v1.0.1</span>
        <div class="flex flex-col items-center text-center mb-8 mt-2">
            <div class="w-16 h-16 bg-blue-600/10 rounded-2xl flex items-center justify-center mb-4 border border-blue-500/20 shadow-inner">
                <i class="ph ph-book-open text-[32px] text-blue-500"></i>
            </div>
            <h1 class="text-2xl font-bold login-text-primary tracking-tight">KCS Hub</h1>
            <p class="login-text-secondary text-sm mt-1">Acesse sua base de conhecimento</p>
        </div>
        <div id="login-form" class="w-full"></div>
        <div class="mt-8 flex items-center justify-center gap-2 text-xs login-text-muted font-medium w-full">
            <i class="ph ph-lock text-[16px]"></i> Acesso via Whitelist SaaS
        </div>
    </div>
  </div>

  <div id="app-screen" class="hidden h-[100dvh] w-full relative overflow-hidden workbench-grid">
    
    <header class="workbench-titlebar bg-surface border-b border-border-subtle px-4 py-2 flex items-center gap-3 sm:gap-4 shrink-0 relative z-30 h-16">
      <button id="btn-toggle-sidebar" onclick="document.getElementById('sidebar').classList.remove('-translate-x-full');" class="lg:hidden text-gray-400 hover:text-gray-900 dark:hover:text-white p-2 transition-colors touch-target">
        <i class="ph ph-list text-[24px]"></i>
      </button>
      
      <div class="flex items-center gap-2 shrink-0 hidden sm:flex">
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 flex items-center justify-center"><i class="ph ph-book-open text-blue-400 text-[20px]"></i></div>
        <div class="flex flex-col justify-center">
            <span class="text-sm font-bold text-gray-900 dark:text-white leading-none">KCS Hub</span>
            <div id="company-plan-badge" class="mt-1 flex items-center overflow-hidden"></div>
        </div>
      </div>
      
      <div class="flex-1 max-w-xl sm:mx-4 w-full">
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-[18px] pointer-events-none"></i>
          <input type="text" id="search-input" class="w-full bg-gray-50 dark:bg-bg-main border border-gray-300 dark:border-border-subtle rounded-xl pl-10 pr-4 py-2 text-sm text-gray-900 dark:text-white placeholder-gray-500 transition-colors focus:ring-2 focus:ring-blue-500/20 outline-none" placeholder="Buscar na base..." />
        </div>
      </div>
      
      <div class="ml-auto flex items-center gap-1 sm:gap-3 shrink-0">
        <div class="relative" id="notif-dropdown-container">
            <button id="btn-notif" class="p-2.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-all relative">
                <i class="ph ph-bell text-[22px]"></i>
                <span id="notif-badge" class="hidden absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 border-2 border-white dark:border-surface rounded-full"></span>
            </button>
            <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-surface border border-gray-200 dark:border-border-subtle rounded-2xl shadow-2xl overflow-hidden z-50">
                <div class="px-4 py-3 border-b border-border-subtle flex justify-between items-center bg-gray-50 dark:bg-bg-main">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Notificações</span>
                    <button onclick="window.__kcs.clearNotifs()" class="text-[10px] text-blue-500 hover:underline">Limpar tudo</button>
                </div>
                <div id="notif-list" class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col">
                    <div class="p-8 text-center text-xs text-gray-500 italic">Nenhuma atualização recente.</div>
                </div>
            </div>
        </div>

        <div class="relative" id="profile-dropdown-container">
            <button id="btn-profile" class="flex items-center gap-2 p-1 pr-2 sm:pr-3 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-all border border-transparent hover:border-gray-200 dark:hover:border-border-subtle">
                <div id="user-avatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-white text-xs font-bold uppercase border-2 border-white dark:border-surface shadow-sm">?</div>
                <i class="ph ph-caret-down text-[12px] text-gray-500"></i>
            </button>
            <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white dark:bg-surface border border-gray-200 dark:border-border-subtle rounded-2xl shadow-2xl overflow-hidden z-50 animate-fade-in">
                <div class="p-4 border-b border-gray-100 dark:border-border-subtle bg-gray-50/50 dark:bg-bg-main/50">
                    <p id="user-name-display" class="text-sm font-bold text-gray-900 dark:text-white truncate">Usuário</p>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="user-role-display" class="text-[9px] font-bold px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 rounded uppercase tracking-wider">Membro</span>
                    </div>
                </div>
                <div class="p-2 flex flex-col gap-0.5">
                    <button id="btn-admin-panel" onclick="window.__kcs.openSettings()" class="hidden items-center gap-3 w-full px-3 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-colors">
                        <i class="ph ph-gear-six text-lg"></i> Administração
                    </button>
                    <button id="btn-company-settings" onclick="window.__kcs.openCompanySettings()" class="hidden items-center gap-3 w-full px-3 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-colors">
                        <i class="ph ph-buildings text-lg"></i> Planos e Limites
                    </button>
                    <button onclick="window.__kcs.toggleTheme()" class="flex items-center gap-3 w-full px-3 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-colors">
                        <i id="theme-toggle-icon" class="ph ph-moon text-lg"></i> Alternar Tema
                    </button>
                    <hr class="my-1.5 border-gray-100 dark:border-border-subtle">
                    <button onclick="window.__kcs.logout()" class="flex items-center gap-3 w-full px-3 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors">
                        <i class="ph ph-sign-out text-lg"></i> Sair do Sistema
                    </button>
                </div>
            </div>
        </div>
      </div>
    </header>

    <div class="workbench-activitybar">
        <div class="activitybar-top">
            <button type="button" class="activitybar-btn active" data-view="articles" title="Artigos (Base de Conhecimento)">
                <i class="ph ph-files"></i>
            </button>
            <button type="button" class="activitybar-btn" data-view="semantic-search" title="Busca Semântica">
                <i class="ph ph-magnifying-glass"></i>
            </button>
            <button type="button" class="activitybar-btn" data-view="sql" title="Biblioteca SQL">
                <i class="ph ph-database"></i>
            </button>
        </div>

        <div class="activitybar-bottom">
            <button type="button" class="activitybar-btn" data-view="account" title="Minha Conta">
                <i class="ph ph-user-circle"></i>
            </button>
            <button type="button" class="activitybar-btn" data-view="settings" title="Configurações e Administração">
                <i class="ph ph-gear"></i>
            </button>
        </div>
    </div>
    <aside id="sidebar" class="workbench-sidebar bg-surface border-r border-border-subtle flex flex-col shrink-0 overflow-y-auto z-50 lg:z-0">
       <div class="p-3 space-y-2 border-b border-border-subtle">
          <button id="btn-new-article" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition-colors shadow-lg shadow-blue-500/20 touch-target">
            <i class="ph ph-plus-circle text-[18px]"></i> Novo Procedimento
          </button>
          <div class="flex gap-2">
            <button id="btn-new-sql" class="flex-1 flex items-center justify-center gap-2 bg-gray-100 dark:bg-bg-main hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200 text-sm font-medium px-4 py-2 rounded-xl transition-colors border border-gray-300 dark:border-border-subtle shadow-sm touch-target">
              <i class="ph ph-database text-purple-600 dark:text-purple-400 text-[18px]"></i> Novo SQL
            </button>
          </div>
        </div>
       <nav id="sidebar-nav" class="flex-1 p-2 space-y-0.5 overflow-y-auto"></nav>
    </aside>

    <main class="workbench-editor flex-1 overflow-y-auto p-4 md:p-6 relative">
        <div id="dashboard-container" class="hidden space-y-6"></div>
        <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </main>

    <div id="kcs-dock" class="workbench-panel"></div>

    <footer class="workbench-statusbar flex items-center justify-between z-50 select-none px-3">
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-1 hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded"><i class="ph-bold ph-x-circle text-red-400"></i> 0</span>
            <span class="flex items-center gap-1 hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded"><i class="ph-bold ph-warning text-yellow-400"></i> 0</span>
            <span class="flex items-center gap-1 hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded"><i class="ph-bold ph-broadcast text-blue-400"></i> Firebase Connected</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="app-version-display" class="hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded">v1.0.1</span>
            <span class="hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded hidden sm:inline">UTF-8</span>
            <span class="hover:bg-white/20 px-2 py-0.5 cursor-pointer rounded"><i class="ph-bold ph-bell"></i></span>
        </div>
    </footer>

    <div id="chatbot-container"></div>
  </div>

  <div id="overlay-root"></div>

  <div id="article-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-2 sm:p-4 modal-backdrop backdrop-blur-sm">
    <div class="bg-surface border border-border-subtle rounded-xl sm:rounded-2xl w-full max-w-4xl h-[100dvh] sm:h-auto sm:max-h-[90vh] flex flex-col shadow-2xl modal-box">
        <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 border-b border-border-subtle shrink-0">
            <h2 id="modal-title" class="text-base sm:text-lg font-bold text-gray-900 dark:text-white">Novo Procedimento</h2>
            <button id="btn-cancel-article" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button>
        </div>
        <form id="article-form" class="flex-1 overflow-y-auto flex flex-col custom-scrollbar">
            <div id="article-form-body" class="p-4 sm:p-6 space-y-4 flex-1"></div>
            <div class="flex flex-col sm:flex-row justify-end gap-3 px-4 sm:px-6 py-4 border-t border-border-subtle bg-bg-main/50 pb-4" id="article-form-footer"></div>
        </form>
    </div>
  </div>

  <div id="view-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-2 sm:p-4 modal-backdrop backdrop-blur-sm">
    <div class="bg-surface border border-border-subtle rounded-xl sm:rounded-2xl w-full max-w-4xl h-[100dvh] sm:h-auto sm:max-h-[90vh] overflow-y-auto shadow-2xl relative modal-box custom-scrollbar">
        <div id="view-modal-content" class="p-4 sm:p-6"></div>
    </div>
  </div>

  <div id="sql-modal" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-2 sm:p-4 modal-backdrop backdrop-blur-sm">
    <div class="bg-surface border border-border-subtle rounded-xl sm:rounded-2xl w-full max-w-4xl h-[100dvh] sm:h-auto sm:max-h-[90vh] flex flex-col shadow-2xl modal-box">
        <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 border-b border-border-subtle shrink-0">
            <h2 id="sql-modal-title" class="text-base sm:text-lg font-bold text-gray-900 dark:text-white">Novo Script SQL</h2>
            <button id="btn-cancel-sql" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button>
        </div>
        <form id="sql-form" class="flex-1 overflow-y-auto flex flex-col custom-scrollbar">
            <div id="sql-form-body" class="p-4 sm:p-6 space-y-4 flex-1"></div>
            <div id="sql-form-footer" class="flex flex-col sm:flex-row justify-end gap-3 px-4 sm:px-6 py-4 border-t border-border-subtle bg-bg-main/50 pb-4"></div>
        </form>
    </div>
  </div>

  <div id="category-modal" class="hidden fixed inset-0 bg-black/70 z-[100] items-center justify-center p-4 modal-backdrop">
    <div class="bg-surface border border-border-subtle rounded-2xl w-full max-w-lg max-h-[80vh] flex flex-col shadow-2xl modal-box">
        <div class="flex items-center justify-between px-6 py-4 border-b border-border-subtle">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Categorias</h2>
            <button id="btn-close-category-modal" class="text-gray-400 hover:text-gray-900 dark:hover:text-white touch-target"><i class="ph ph-x text-[20px]"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
            <div id="category-list" class="space-y-0.5 mb-4"></div>
            <form id="category-form" class="bg-gray-50 dark:bg-bg-main rounded-lg p-4 space-y-3 border border-border-subtle">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Nova Categoria</p>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="cat-name" placeholder="Nome" required class="col-span-2 bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm" />
                    <input type="text" id="cat-icon" placeholder="Ícone" value="ph-folder" class="bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm text-center" />
                </div>
                <select id="cat-parent" class="w-full bg-surface border border-border-subtle rounded-lg px-3 py-2 text-gray-900 dark:text-white text-sm"><option value="">Raiz</option></select>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm py-2.5 rounded-lg touch-target transition-colors">Adicionar</button>
            </form>
        </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
